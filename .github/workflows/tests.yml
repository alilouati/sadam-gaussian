name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Unit tests, gradient check, and reproduction of the paper's tables from the logs
        run: pytest -v --junitxml=junit.xml
      - name: Report failing tests as annotations
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for tc in ET.parse("junit.xml").getroot().iter("testcase"):
              for f in list(tc.findall("failure")) + list(tc.findall("error")):
                  msg = (f.get("message", "") + " | " + (f.text or "")[-1500:]).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={tc.get('name')}::{msg}")
          PY
      - name: Regenerate all figures from the logs
        run: cd code && python replot.py
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-figures-and-tables
          path: outputs/
